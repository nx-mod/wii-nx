schema_version: 1
workspace_root: ..

# New Super Mario Bros. Wii. Every value below was read from a real dump by
# example-wii-nx's extract-dol + inspect-dol; README.md shows how.
project:
  id: nsmbwii-smne01
  display_name: New Super Mario Bros. Wii
  game_id: SMNE01            # NTSC-U, revision 2
  region: E

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x8042F680        # _SDA_BASE_  (r13), set in the startup code
  sda2_base: 0x80433080       # _SDA2_BASE_ (r2),  set in the startup code

inputs:
  dol:
    path: disc/sys/main.dol
    sha256: 0373b4dbffd7c9da9d27eb7257a7677877a3e33ceb81818bab1daa93560b9907

translation:
  entry_points:
    - 0x80004050              # the DOL header's entry point
  allow_unsupported_instructions: false

runtime:
  native_registration_root: ../wiicompiled-nx/runtime/src
  native_abi_directories:
    - ../wiicompiled-nx/runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/nsmbwii_base_manifest.json
