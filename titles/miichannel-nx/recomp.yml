schema_version: 1
workspace_root: .

# Mii Channel. Not a disc: a Wii system title, downloaded from Nintendo the way
# a console downloads it. Every value below was read out of the title itself by
# libdol-nx's wiinx-fetch-title, wiinx-inspect-dol and wiinx-scan.
project:
  id: miichannel-haca
  display_name: MiiChannel
  title: Mii Channel          # the name its own banner carries
  game_id: HACA
  title_id: 0001000248414341
  region: A                   # the title serves every region
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: miichannel_base

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x803C4520        # _SDA_BASE_  (r13), set in the startup code
  sda2_base: 0x803C6040       # _SDA2_BASE_ (r2),  set in the startup code

translation:
  entry_points:
    - 0x80006124              # the DOL header's own entry point
  function_map:
    path: functions.map
  allow_unsupported_instructions: false

inputs:
  dol:
    path: title/main.dol
    sha256: b6a8f1e47c3b52de69e25e30b22227b4b227e697bc5a059fff738e9a40df31d8

# Where libdol-nx is, relative to this folder.
runtime:
  native_registration_root: ../../../libdol-nx/src
  native_abi_directories:
    - ../../../libdol-nx/src/platform/gx
  native_bindings: bindings.json

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/miichannel_base_manifest.json
