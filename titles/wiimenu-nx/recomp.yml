schema_version: 1
workspace_root: .

# The Wii Menu. Its boot content is a DOL whose code section is a kilobyte of
# BAT setup; the program is the 3.4 MB image behind it, loaded high in MEM1 and
# entered at its first instruction. tools/wiinx-title-program writes that out as
# an ordinary DOL, which is what this translates.
project:
  id: wiimenu-0000000100000002
  display_name: Wii Menu
  game_id: RHAE                 # the System Menu has no disc id; this is its channel
  region: E
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: wiimenu_base

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x81672660
  sda2_base: 0x81670A60

translation:
  entry_points:
    - 0x81330000
  function_map:
    path: functions.map
  allow_unsupported_instructions: false

inputs:
  dol:
    path: title/program.dol
    sha256: d782af9e2951ce39aa780c4705816c242432574af1db2170e52942eda3575f17

# Where libdol-nx is, relative to this folder.
runtime:
  native_registration_root: ../../../libdol-nx/src
  native_abi_directories:
    - ../../../libdol-nx/src/platform/gx
  native_bindings: bindings.json

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/wiimenu_base_manifest.json
