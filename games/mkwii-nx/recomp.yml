schema_version: 1
workspace_root: .

# MarioKartWii. Generated by libdol-nx tools/wiinx-new-game from the disc.
project:
  id: mkwii-rmcp01
  display_name: MarioKartWii
  title: Mario Kart Wii          # the name its own banner carries
  game_id: RMCP01            # PAL, revision 0
  region: P
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  # 26 MiB: MEM1, and the window above it this game's REL is relocated into.
  size: 0x01A00000
  sda_base: 0x8038CC00
  sda2_base: 0x8038EFA0

translation:
  entry_points:
    - 0x800060A4
  # Mario Kart Wii's symbols are mapped by the decompilation community, so this
  # game uses the real thing rather than `wiinx-scan functions`.
  function_map:
    path: MAP.txt
  allow_unsupported_instructions: false

inputs:
  dol:
    path: disc/sys/main.dol
    sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05

  # Most of this game is in one REL, relocated at boot.
  rel:
    path: disc/files/rel/StaticR.rel
    load_address: 0x805102E0
    sha256: 16d9d146112541fefea701ecb5bc1a496f9d50e4a752fbb5b6778e7c6399f67d

  # First pass: no unsupported instructions, so gaps surface immediately.
  # (translation.entry_points above comes from the DOL header.)

# Where libdol-nx is, relative to this folder: the natives translated
# calls bind to. Change these two if you move either checkout.
runtime:
  native_registration_root: ../../libdol-nx/src
  native_abi_directories:
    - ../../libdol-nx/src/platform/gx
  # This is the game libdol-nx's natives were written from, so the addresses
  # they are registered at are this game's own. Every other game names its own
  # table here instead (docs/signatures.md).
  native_bindings: bindings.json

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/mkwii_base_manifest.json

# Retro Rewind: this game's own mod, built as a second executable beside the
# base game from the pack you installed. The paths are yours - nothing of the
# pack is in this repository - and the product definition it links is
# native/product/retro_rewind_product.cpp.
profiles:
  retro-rewind:
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/RetroRewind/RetroRewind6/Binaries/Code.pul
    mod_root: PulsarPacks/completed/RetroRewind/RetroRewind6
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/retro_rewind_full_cpp
    enable_retro_wfc: true
    retro_wfc_payload: https://rwfc.net/api/wfc/payload?g=RMCPD00
    retro_wfc_legacy_bootstrap_hook: 0x800ED6E8
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
