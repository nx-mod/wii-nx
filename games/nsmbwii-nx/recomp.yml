schema_version: 1
workspace_root: .

# New SUPER MARIO BROS. Wii. Generated by libdol-nx tools/wiinx-new-game from the disc.
project:
  id: nsmbwii-smne01
  display_name: New SUPER MARIO BROS. Wii
  game_id: SMNE01            # NTSC-U, revision 2
  region: E

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x8042F680
  sda2_base: 0x80433080

translation:
  entry_points:
    - 0x80004050
  # Where this game's functions start, found in its own code by
  # `wiinx-scan functions`. Without it only what the entry point reaches by
  # direct calls is translated, which in a C++ game is a fraction of it.
  function_map:
    path: functions.map

inputs:
  dol:
    path: disc/sys/main.dol
    sha256: 0373b4dbffd7c9da9d27eb7257a7677877a3e33ceb81818bab1daa93560b9907

  # First pass: no unsupported instructions, so gaps surface immediately.
  # (translation.entry_points above comes from the DOL header.)

# Where libdol-nx is, relative to this folder: the natives translated
# calls bind to. Change these two if you move either checkout.
runtime:
  native_registration_root: ../../libdol-nx/src
  native_abi_directories:
    - ../../libdol-nx/src/platform/gx
  # Written by wiinx-scan: which address each native has in this game.
  native_bindings: bindings.json

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/nsmbwii_base_manifest.json
