schema_version: 1
workspace_root: .

# Wii Sports (RSPE01). The entry point comes from the ogws decompilation's
# symbol map; the small-data bases and the checksum come from your disc, via
# scripts/extract --dol, and are TODO until then.
project:
  id: wiisports-rspe01
  display_name: Wii Sports
  game_id: RSPE01
  region: E

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x00000000        # TODO: _SDA_BASE_  (r13), from inspect-dol
  sda2_base: 0x00000000       # TODO: _SDA2_BASE_ (r2),  from inspect-dol

inputs:
  dol:
    path: disc/sys/main.dol
    sha256: TODO

translation:
  entry_points:
    - 0x80006124              # __start, per ogws's symbols (both retail revisions)
  # Written by scripts/fetch-symbols from ogws: every function boundary, named.
  function_map:
    path: wiigames-nx/wiisports-nx/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: ../../wiicompiled-nx/runtime/src
  native_abi_directories:
    - ../../wiicompiled-nx/runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/wiisports_base_manifest.json
