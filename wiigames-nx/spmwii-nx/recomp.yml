schema_version: 1
workspace_root: ..

# Super Paper Mario. Every value below was read from a real dump by
# example-wii-nx's extract-dol + inspect-dol; README.md shows how.
project:
  id: spmwii-r8pe01
  display_name: Super Paper Mario
  game_id: R8PE01            # NTSC-U, revision 2
  region: E

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x80574900        # _SDA_BASE_  (r13), set in the startup code
  sda2_base: 0x80575C60       # _SDA2_BASE_ (r2),  set in the startup code

inputs:
  dol:
    path: disc/sys/main.dol
    sha256: 316fe3a88654cf55f164a493fdc7d872fb7362298613e335a2240b4921bfe7a0

translation:
  entry_points:
    - 0x80006124              # the DOL header's entry point
  allow_unsupported_instructions: false

runtime:
  native_registration_root: ../wiicompiled-nx/runtime/src
  native_abi_directories:
    - ../wiicompiled-nx/runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/spmwii_base_manifest.json
