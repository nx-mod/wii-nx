schema_version: 1
workspace_root: ..

# Mii Channel. Not a disc: a Wii system title, downloaded from Nintendo by
# scripts/fetch. Every value below was read from it by example-wii-nx's
# fetch-title + inspect-dol.
project:
  id: miichannel-haca
  display_name: Mii Channel
  title_id: 0001000248414341
  region: A                   # the title serves every region

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x803C4520        # _SDA_BASE_  (r13), set in the startup code
  sda2_base: 0x803C6040       # _SDA2_BASE_ (r2),  set in the startup code

inputs:
  dol:
    path: title/main.dol
    sha256: b6a8f1e47c3b52de69e25e30b22227b4b227e697bc5a059fff738e9a40df31d8

translation:
  entry_points:
    - 0x80006124              # the DOL header's entry point
  allow_unsupported_instructions: false

runtime:
  native_registration_root: ../wiicompiled-nx/runtime/src
  native_abi_directories:
    - ../wiicompiled-nx/runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/miichannel_base_manifest.json
