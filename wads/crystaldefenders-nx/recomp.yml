schema_version: 1
workspace_root: .

# Crystal Defenders R1, the WiiWare title. Its TMD boots the loader several
# WiiWare titles share; this is the content that loader jumps into, which here
# is a plain executable rather than a compressed one.
project:
  id: crystaldefenders-wcie
  display_name: CrystalDefendersR1
  title: Crystal Defenders          # what the launcher and the home menu show
  game_id: WCIE
  region: E
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: crystaldefenders_base

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x8028D100
  sda2_base: 0x8028F000

translation:
  entry_points:
    - 0x8000403C
  function_map:
    path: functions.map
  allow_unsupported_instructions: false

inputs:
  dol:
    path: game/payload.dol
    sha256: 0cd7d65a2ab90fb0c645b9a574ab49b346e9e45b9b52b33541b0eccd63e8be9a

# Where libdol-nx is, relative to this folder.
runtime:
  native_registration_root: ../../../libdol-nx/src
  native_abi_directories:
    - ../../../libdol-nx/src/platform/gx
  native_bindings: bindings.json

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/crystaldefenders_base_manifest.json
