schema_version: 1
workspace_root: .

# Mega Man 9, the WiiWare title. Its TMD boots a small loader; this is what the
# loader expands and jumps into - content 0000000c, LZ11-compressed on the
# card, 2.87 MB of PowerPC once it is not.
project:
  id: megaman9-wr9e
  display_name: MegaMan9
  game_id: WR9E
  region: E
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: megaman9_base

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x804F4660
  sda2_base: 0x804F74A0

translation:
  entry_points:
    - 0x8000403C
  function_map:
    path: functions.map
  allow_unsupported_instructions: false

inputs:
  dol:
    path: game/payload.dol
    sha256: c339f975843ebef5730d778b42c5aa4c3b250e91ce841332958e3f532777a985

# Where libdol-nx is, relative to this folder: the natives translated calls
# bind to, and the table saying where this game keeps the functions they
# replace.
runtime:
  native_registration_root: ../../../libdol-nx/src
  native_abi_directories:
    - ../../../libdol-nx/src/platform/gx
  native_bindings: bindings.json

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/megaman9_base_manifest.json
